{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-lg border border-slate-100 flex flex-col items-center text-center">
    
    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 border-4 border-white shadow-sm">
        <span class="text-2xl">🔒</span>
    </div>
    
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-2">Encrypted Message</h1>
    <p class="text-sm text-slate-500 mb-6">This QR code contains an encrypted payload. Please enter the password to decrypt it.</p>
    
    <!-- Decryption Form -->
    <div id="unlock-form" class="w-full space-y-4">
        <input type="password" id="password" placeholder="Enter Password" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-slate-700 text-center font-bold tracking-widest shadow-inner">
        <button onclick="decryptPayload()" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md">
            Unlock Payload
        </button>
        <p id="error-msg" class="text-xs text-red-500 font-bold hidden">Incorrect password or corrupted data.</p>
    </div>

    <!-- Decrypted Result -->
    <div id="result-container" class="w-full hidden flex-col items-center">
        <div class="w-full p-4 bg-emerald-50 border border-emerald-100 rounded-xl mb-4">
            <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-2">Decrypted Content</p>
            <p id="decrypted-text" class="text-slate-800 font-medium break-all whitespace-pre-wrap"></p>
            <a id="decrypted-link" href="#" target="_blank" class="hidden mt-2 text-sm font-bold text-indigo-600 hover:underline break-all">Open Link</a>
        </div>
    </div>
    
    <p class="mt-8 text-[10px] text-slate-400 font-medium uppercase tracking-widest">Secured by NexQR AES-256</p>
</div>

<script>
    const encryptedData = "{{ qr.encrypted_payload|escapejs }}";

    function decryptPayload() {
        const pass = document.getElementById('password').value;
        const err = document.getElementById('error-msg');
        if(!pass) return;

        try {
            const bytes = CryptoJS.AES.decrypt(encryptedData, pass);
            const originalText = bytes.toString(CryptoJS.enc.Utf8);

            if (!originalText) {
                throw new Error("Wrong password");
            }

            // Success
            document.getElementById('unlock-form').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            document.getElementById('result-container').classList.add('flex');
            
            // Check if it's a URL
            if (originalText.startsWith('http://') || originalText.startsWith('https://')) {
                document.getElementById('decrypted-link').href = originalText;
                document.getElementById('decrypted-link').innerText = originalText;
                document.getElementById('decrypted-link').classList.remove('hidden');
                document.getElementById('decrypted-text').classList.add('hidden');
            } else {
                document.getElementById('decrypted-text').innerText = originalText;
            }
            
        } catch (e) {
            err.classList.remove('hidden');
            setTimeout(() => err.classList.add('hidden'), 3000);
        }
    }
</script>
{% endblock %}
