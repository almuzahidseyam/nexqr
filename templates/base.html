{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}NexQR{% endblock %}</title><link rel="stylesheet" href="{% static 'app.css' %}"></head>
<body><header><a class="brand" href="{% url 'dashboard' %}">NexQR</a><nav aria-label="Main navigation">{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">My QR codes</a><span>{{ user.username }}</span><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="quiet">Sign out</button></form>{% else %}<a href="{% url 'login' %}">Sign in</a>{% endif %}</nav></header>
<main>{% block content %}{% endblock %}</main><footer>Simple links. Thoughtfully shared.</footer>{% block scripts %}{% endblock %}</body></html>
