name: Verify NexQR
on: [push, pull_request]
permissions:
  contents: read
env:
  SECRET_KEY: ci-only-key-not-used-in-production-0123456789-abcdefghijklmnopqrstuvwxyz
  DEBUG: 'True'
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt pip-audit -c constraints.txt
      - run: python manage.py test
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: node --test tests/crypto.cjs
      - run: python -m pip_audit -r requirements.txt
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_USER: nexqr
          POSTGRES_DB: nexqr
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexqr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexqr:ci-fixture-only@127.0.0.1:5432/nexqr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test
