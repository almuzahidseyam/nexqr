services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nexqr
      POSTGRES_USER: nexqr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexqr -d nexqr"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:8000 --timeout 120 nexqr_project.wsgi:application"
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexqr:${POSTGRES_PASSWORD}@db:5432/nexqr
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
